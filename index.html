<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>علي البدراني | البطاقة الذكية Smart Card</title>
    <meta name="description" content="البطاقة التعريفية الرقمية الذكية للسيد علي البدراني - تواصل مباشر، فصيلة الدم O+، وروابط التواصل المعتمدة">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 24, 38, 0.85);
            --border-color: rgba(212, 175, 55, 0.3);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Tajawal', sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .nfc-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            color: var(--gold-light);
            font-weight: 700;
        }
        .profile-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .avatar-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 { font-size: 24px; font-weight: 900; color: var(--text-main); margin-bottom: 4px; }
        p.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        .blood-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .btn-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            border: none;
        }
        .btn-save { background: var(--gold); color: #000; }
        .btn-save:hover { background: #e6c547; }
        .btn-share { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-share:hover { background: rgba(255,255,255,0.15); }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }
        .link-item:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }
        .link-info { display: flex; align-items: center; gap: 14px; }
        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .link-text .title { font-size: 15px; font-weight: 700; display: block; }
        .link-text .sub { font-size: 12px; color: var(--text-muted); direction: ltr; text-align: right; display: block; }
        .toast {
            position: fixed;
            bottom: 20px;
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شارة NFC -->
        <div class="nfc-badge">
            <span>⚡ بطاقة تعريف ذكية معتمدة</span>
        </div>

        <!-- كارد الملف الشخصي -->
        <div class="profile-card">
            <div class="avatar-box">
                <img src="ali_photo.jpg" alt="علي البدراني">
            </div>
            <h1>علي البدراني</h1>
            <p class="subtitle">علي يعقوب حامد البدراني</p>

            <div class="blood-group-badge">
                <span>فئة الدم: <strong>O+</strong> (متبرع عام)</span>
            </div>

            <div class="quick-actions">
                <button class="btn-pill btn-save" onclick="saveContact()">حفظ جهة الاتصال</button>
                <button class="btn-pill btn-share" onclick="shareCard()">مشاركة البطاقة</button>
            </div>
        </div>

        <!-- أزرار التواصل -->
        <div class="links-list">
            <a href="tel:+9647729530556" class="link-item">
                <div class="link-info">
                    <div class="link-icon">📞</div>
                    <div class="link-text">
                        <span class="title">اتصال رئيسي</span>
                        <span class="sub">+964 772 953 0556</span>
                    </div>
                </div>
                <span>←</span>
            </a>

            <a href="tel:+9647756333616" class="link-item">
                <div class="link-info">
                    <div class="link-icon">📱</div>
                    <div class="link-text">
                        <span class="title">اتصال إضافي</span>
                        <span class="sub">+964 775 633 3616</span>
                    </div>
                </div>
                <span>←</span>
            </a>

            <a href="https://wa.me/9647729530556?text=مرحباً%20أستاذ%20علي%20البدراني،%20تواصلت%20معك%20من%20خلال%20بطاقتك%20الذكية." class="link-item" target="_blank">
                <div class="link-info">
                    <div class="link-icon" style="color: #25d366;">💬</div>
                    <div class="link-text">
                        <span class="title">محادثة واتساب</span>
                        <span class="sub">WhatsApp Direct</span>
                    </div>
                </div>
                <span>←</span>
            </a>
        </div>
    </div>

    <div id="toast" class="toast">تم النسخ بنجاح</div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }
        function saveContact() {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:علي البدراني\nTEL:+9647729530556\nTEL:+9647756333616\nNOTE:فصيلة الدم O+\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Ali_AlBadrani.vcf';
            a.click();
            showToast('تم تحميل ملف الاتصال بنجاح');
        }
        function shareCard() {
            if (navigator.share) {
                navigator.share({ title: 'علي البدراني - البطاقة الذكية', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('تم نسخ رابط البطاقة');
            }
        }
    </script>
</body>
</html>
